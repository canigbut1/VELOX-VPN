name: Build VELOX Native App

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/velox-native.yml'
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Fetch official XTLS libXray Android engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 \
            https://github.com/XTLS/libXray/releases/download/v26.10.29/libxray-android.zip \
            -o /tmp/libxray-android.zip
          unzip -j /tmp/libxray-android.zip '*libXray.aar' -d app/libs
          test -s app/libs/libXray.aar
      - name: Build arm64 APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: VELOX-native-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
