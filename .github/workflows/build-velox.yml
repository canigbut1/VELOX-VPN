name: Build VELOX VPN (Xray engine)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VELOX repository
        uses: actions/checkout@v4

      - name: Checkout upstream v2rayNG engine and UI
        run: git clone --depth 1 --recurse-submodules https://github.com/2dust/v2rayNG.git source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Add Android 37 SDK alias for Gradle
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Compile native tunnel and install Xray library
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;30.0.16248370"
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          sed -i '/android {/a\    ndkVersion = "30.0.16248370"' V2rayNG/app/build.gradle.kts
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/
          TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          curl -fL --retry 3 "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar" -o V2rayNG/app/libs/libv2ray.aar
          test -s V2rayNG/app/libs/libv2ray.aar

      - name: Apply VELOX branding and store identity
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("V2rayNG/app/build.gradle.kts")
          s = gradle.read_text()
          s = re.sub(r'applicationId = "com\\.v2ray\\.ang"', 'applicationId = "com.velox.vpn"', s)
          s = re.sub(r'versionCode = \d+', 'versionCode = 1', s)
          s = re.sub(r'versionName = "[^"]+"', 'versionName = "1.0.0"', s)
          gradle.write_text(s)

          strings = Path("V2rayNG/app/src/main/res/values/strings.xml")
          s = strings.read_text().replace('<string name="app_name" translatable="false">v2rayNG</string>',
                                           '<string name="app_name" translatable="false">VELOX VPN</string>')
          strings.write_text(s)

          themes = Path("V2rayNG/app/src/main/res/values/themes.xml")
          s = themes.read_text()
          s = s.replace('#FFFFFFFF', '#FF07111F').replace('#FF1C1B1F', '#FF07111F')
          s = s.replace('<item name="android:windowLightStatusBar">true</item>',
                        '<item name="android:windowLightStatusBar">false</item>')
          themes.write_text(s)
          PY

      - name: Build store-flavor release APK
        working-directory: source/V2rayNG
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assemblePlaystoreRelease -PABI_FILTERS=arm64-v8a --no-daemon
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Collect APK and licensing notices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find source/V2rayNG/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/VELOX_VPN_1.0.0_arm64_unsigned.apk
          cp source/LICENSE dist/UPSTREAM_LICENSE.txt 2>/dev/null || true
          cp source/V2rayNG/LICENSE dist/APP_LICENSE.txt 2>/dev/null || true
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          test -s dist/VELOX_VPN_1.0.0_arm64_unsigned.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELOX-VPN-1.0.0-ARM64-UNSIGNED
          path: dist/*
          if-no-files-found: error
