name: Build VELOX VPN (Xray engine)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VELOX repository
        uses: actions/checkout@v4

      - name: Checkout upstream Xray engine
        run: git clone --depth 1 --recurse-submodules https://github.com/2dust/v2rayNG.git source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Add Android 37 SDK alias for Gradle
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Compile native tunnel and install Xray library
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;30.0.16248370"
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          sed -i '/android {/a\    ndkVersion = "30.0.16248370"' V2rayNG/app/build.gradle.kts
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/
          TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          curl -fL --retry 3 "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar" -o V2rayNG/app/libs/libv2ray.aar
          test -s V2rayNG/app/libs/libv2ray.aar

      - name: Apply VELOX app identity and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path("source/V2rayNG/app/src/main/res")
          # Update every localized app-name resource, not only the default locale.
          for f in root.glob("values*/strings.xml"):
              s = f.read_text()
              s = re.sub(r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                         r'\1VELOX VPN\2', s, flags=re.S)
              f.write_text(s)

          gradle = Path("source/V2rayNG/app/build.gradle.kts")
          s = gradle.read_text()
          s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.velox.vpn"', s)
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 3', s)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.2"', s)
          gradle.write_text(s)

          # Install the repository's VELOX shield/V mark as the adaptive launcher icon.
          shutil.copy("app/src/main/res/drawable/ic_velox_foreground.xml", root / "drawable/ic_velox_foreground.xml")
          (root / "values/velox_icon.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="velox_icon_bg">#071426</color></resources>\n')
          adaptive = root / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / "ic_launcher.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@color/velox_icon_bg"/>'
              '<foreground android:drawable="@drawable/ic_velox_foreground"/>'
              '</adaptive-icon>\n')
          # Ensure the application label and launcher icon are explicit.
          manifest = Path("source/V2rayNG/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              m = manifest.read_text()
              m = re.sub(r'android:label="[^"]+"', 'android:label="VELOX VPN"', m, count=1)
              manifest.write_text(m)
          PY

      - name: Build ARM64 release APK
        working-directory: source/V2rayNG
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assemblePlaystoreRelease -PABI_FILTERS=arm64-v8a --no-daemon
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Sign APK with Android apksigner (v2/v3)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find source/V2rayNG/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/VELOX_VPN_1.0.2_arm64_unsigned.apk
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/velox-release.jks" \
            -alias velox -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=VELOX VPN, OU=Android, O=VELOX, L=Berlin, C=DE"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/velox-release.jks" --ks-key-alias velox \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out dist/VELOX_VPN_1.0.2_arm64.apk dist/VELOX_VPN_1.0.2_arm64_unsigned.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs dist/VELOX_VPN_1.0.2_arm64.apk
          cp source/LICENSE dist/UPSTREAM_LICENSE.txt 2>/dev/null || true
          cp source/V2rayNG/LICENSE dist/APP_LICENSE.txt 2>/dev/null || true
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          test -s dist/VELOX_VPN_1.0.2_arm64.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VELOX-VPN-1.0.2-ARM64-SIGNED
          path: dist/*
          if-no-files-found: error
